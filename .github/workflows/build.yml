name: Gerar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APKs (debug)
        run: gradle :app:assembleDebug :admin:assembleDebug --no-daemon --stacktrace

      - name: Renomear APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NeuraVision.apk
          cp admin/build/outputs/apk/debug/admin-debug.apk dist/NeuraVision-Licencas-ADMIN.apk

      - name: Publicar APKs (artefato)
        uses: actions/upload-artifact@v4
        with:
          name: NeuraVision-APKs
          path: dist/*.apk

      - name: Publicar APKs em Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: NeuraVision APK ${{ github.run_number }}
          body: |
            NeuraVision.apk — app do cliente (instale nos clientes).
            NeuraVision-Licencas-ADMIN.apk — gerador de licenças (SÓ no seu aparelho; NÃO distribua).
          files: dist/*.apk
